<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jury Portal - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reliability.css">
    <link rel="stylesheet" href="css/brand.css">
</head>
<body>
    <main class="login-container">
        <section class="login-intro" aria-label="About Jury Portal">
            <div class="login-brand"><img src="assets/ratiio-logo.jpg" alt="Ratiio" width="320" height="320"></div>
            <h2>Great ideas.<br>Thoughtful judging.</h2>
            <p>A clear space to evaluate teams and recognize the ideas that stand out.</p>
        </section>
        <div class="login-box">
            <span class="login-eyebrow">Hackathon Evaluation System</span>
            <h1>Jury Portal</h1>
            <p>Welcome back. Sign in to your workspace.</p>
            
            <div id="error-message" class="error hidden" role="alert"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="login-help">Use the account provided by your event organizer.</p>
            <footer class="brand-footer"><span>Developed by <strong>Ratiio</strong></span></footer>
        </div>
    </main>
    
    <script src="js/common.js?v=round-manager-3"></script>
    <script src="js/theme.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
